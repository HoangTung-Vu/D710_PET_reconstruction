[pytest]
testpaths = tests

# Where the tests import from, declared once here instead of by `sys.path`
# surgery in `conftest.py`.  Both entries are relative to this file.
#
#   .        `utils` and `osem` are real packages -- `from utils import
#            attenuation`, `from osem import recon`.
#   vendor   `estimate.py`, `to_stir.py`, `ct_to_pifa.py` and friends are
#            SCRIPTS, not a package: they are run as `python3 vendor/x.py`, so
#            their own directory is `sys.path[0]` and they import each other by
#            bare name (`from make_pifa import pack_header`).  The tests put
#            them on the path the same way rather than inventing a package
#            layout the shipped code does not have.
#
# `tests/` itself is added by pytest (prepend import mode), which is what makes
# `import interfile` / `import synth_hs` / `from cases import ...` work.
pythonpath = . vendor
