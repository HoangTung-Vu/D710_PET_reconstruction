# The Python side of D710, as a uv project.
#
# WHAT THIS DOES AND DOES NOT REPRODUCE
#
# These are the third-party packages `D710/` actually imports, found by walking
# the AST of every .py in the tree rather than by freezing an environment (the
# conda env this came from lists 108 packages; the tree imports ten).
#
# It is NOT an export of the `petct_reconstruction` conda environment and
# cannot rebuild it.  `sirf` and `stir` are absent ON PURPOSE: they are C++
# builds made from source into `$CONDA_PREFIX/dlevel/`, linked against that
# environment's own libraries, and the loader needs the environment's
# LD_LIBRARY_PATH -- no dependency file can reproduce them on another machine.
# Without them `d710 attn`, `d710 osem` and `d710 export` report which
# interpreters they tried and stop; decode, estimate, tostir, exam, lm and
# lowdose are unaffected, and the tests that need SIRF skip rather than fail.
#
# `parallelproj` is absent for a different reason and it matters: it is NOT ON
# PyPI (404), and `pytomography` does not name it in `requires_dist` either --
# not even as an extra.  So `uv sync` gives a PyTomography that imports fine and
# cannot reconstruct: the import is lazy, inside
# `pytomography.projectors.PET`, and only `d710 lm recon` reaches it.
#
# It does NOT need conda to RUN, only to be fetched from somewhere.  The package
# is pure Python (7 modules) plus one 68 KB `libparallelproj_c.so`, and
# `parallelproj.backend` takes `$PARALLELPROJ_C_LIB` as an explicit override --
# measured: both drop into `.venv` and `joseph3d_fwd` returns the right answer.
# `tools/fetch_parallelproj.sh` does that; until it is run, `d710 lm` is the one
# command `uv sync` alone does not cover.
#
# `petsird` is likewise absent: it is pinned to 0.9.1 inside the `d710:full`
# image by the Dockerfile, so a .prd written in the container matches one
# written on the host.  It is not a host dependency.
#
# TORCH BUILD.  Resolving here gives the default PyPI build, which carries CUDA
# wheels but runs on CPU when no GPU is present -- which is the case on the
# machine this was measured on, so the list-mode path is CPU-bound either way.
# On a GPU machine, install torch from PyTorch's own index first.
#
#   uv sync                     create .venv and install
#   uv run pytest -q            run the tests in it
#   uv run python -m utils.export --case ped --format nifti
#
# `d710` finds this environment on its own -- `$VIRTUAL_ENV/bin/python` is one
# of the interpreters it tries -- and can always be named outright with
#   export D710_PYTHON=$PWD/.venv/bin/python

[project]
name = "petct_reconstruction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9",     # utils/plots.py only
    "nibabel>=5.3",        # NIfTI export
    "numpy>=2.0",          # every module
    "pydicom>=3.0",        # CT in, PET DICOM out
    "pytomography>=3.4",   # the list-mode reconstructor (d710 lm)
    "scipy>=1.14",         # osem/stitch.py, the axial post-filter
    "torch>=2.4",          # pulled in by pytomography; lm/ imports it directly
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
